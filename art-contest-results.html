<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>نتائج مسابقة أفضل رسام | كوكب الطفل</title><style>body{font:16px Arial,sans-serif;background:#faf7ff;color:#292044;margin:0}main{max-width:1000px;margin:auto;padding:25px}section{background:white;padding:20px;border-radius:18px;margin:15px 0}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}.card{border:1px solid #eee;border-radius:12px;padding:12px}.card img{width:100%;height:170px;object-fit:contain}a{color:#6535b4}</style></head><body><main><a href="/art-contest.html">← التصويت</a><h1>🏆 نتائج مسابقة أفضل رسام</h1><p>تُعرض الأصوات المسجلة فقط. النتائج نهائية بعد انتهاء فترة المجموعة ومراجعة الإدارة.</p><div id="results">جاري تحميل النتائج...</div></main><script>
async function load(){try{const r=await fetch('/api/art-contest/results',{cache:'no-store'});if(!r.ok)throw Error('unavailable');const data=await r.json(),root=document.getElementById('results');root.replaceChildren();const groups=new Map();for(const row of data.results){if(!groups.has(row.number))groups.set(row.number,[]);groups.get(row.number).push(row)}if(!groups.size){root.textContent='لم تُنشر نتائج بعد';return}
for(const [number,rows] of groups){const section=document.createElement('section'),title=document.createElement('h2'),cards=document.createElement('div');title.textContent='المجموعة '+number;cards.className='cards';const closed=Date.now()>=new Date(rows[0].ends_at).getTime();for(const [i,a] of rows.entries()){const card=document.createElement('div'),img=document.createElement('img'),h=document.createElement('h3'),p=document.createElement('p');card.className='card';img.src=a.image_url;img.alt='رسمة '+a.display_name;h.textContent=a.display_name+' — #'+a.entry_number;p.textContent=a.votes+' صوت'+(closed&&i===0?' — متصدر المجموعة':'');card.append(img,h,p);cards.append(card)}section.append(title,cards);root.append(section)}}catch{document.getElementById('results').textContent='تعذر تحميل النتائج'}}
load();setInterval(load,15000)</script></body></html>
